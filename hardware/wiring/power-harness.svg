<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040"><rect width="1500" height="1040" fill="#ffffff"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="31" fill="#18364b">Revision 0.2 external power harness — repeat independently for each tank</text><text x="45" y="86" font-family="Arial,sans-serif" font-size="20" fill="#18364b">Pin 1 is positive. Keep PV_NEG separate from GND outside the charger. Charger LOAD terminals unused.</text><rect x="45" y="135" width="280" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="59" y="165" font-family="Arial,sans-serif" font-size="23" fill="#18364b">Two series 20 W panels</text><text x="59" y="195" font-family="Arial,sans-serif" font-size="18" fill="#18364b">SPM040201200 ×2</text><text x="59" y="221" font-family="Arial,sans-serif" font-size="18" fill="#18364b">40 W per node; cold Voc50.74 V</text><rect x="390" y="135" width="290" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="404" y="165" font-family="Arial,sans-serif" font-size="23" fill="#18364b">PCB J4 → D9 → R2 → J5</text><text x="404" y="195" font-family="Arial,sans-serif" font-size="18" fill="#18364b">J4.1 →reverse diode→20 mΩ</text><text x="404" y="221" font-family="Arial,sans-serif" font-size="18" fill="#18364b">J4.2 and J5.2 = PV_NEG</text><rect x="790" y="135" width="360" height="160" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="804" y="165" font-family="Arial,sans-serif" font-size="23" fill="#18364b">SmartSolar MPPT75/10</text><text x="804" y="195" font-family="Arial,sans-serif" font-size="18" fill="#18364b">PV+ / PV− from J5 only</text><text x="804" y="221" font-family="Arial,sans-serif" font-size="18" fill="#18364b">BAT+ / BAT− from J2</text><text x="804" y="247" font-family="Arial,sans-serif" font-size="18" fill="#18364b">LOAD+ / LOAD− unused</text><polyline points="325,185 390,185" fill="none" stroke="#c03b32" stroke-width="4"/><polyline points="680,185 790,185" fill="none" stroke="#c03b32" stroke-width="4"/><polyline points="325,235 360,235 360,315 735,315 735,240 790,240" fill="none" stroke="#2879a0" stroke-width="4"/><text x="425" y="345" font-family="Arial,sans-serif" font-size="18" fill="#2879a0">PV return: no external battery− bridge</text><rect x="45" y="420" width="250" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="59" y="450" font-family="Arial,sans-serif" font-size="23" fill="#18364b">12.8 V20 Ah battery</text><text x="59" y="480" font-family="Arial,sans-serif" font-size="18" fill="#18364b">BAT512020705 +BMS</text><text x="59" y="506" font-family="Arial,sans-serif" font-size="18" fill="#18364b">Confirm cold-charge inhibit</text><rect x="355" y="420" width="300" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="369" y="450" font-family="Arial,sans-serif" font-size="23" fill="#18364b">5 A fuse → J1 → MOSFETs</text><text x="369" y="480" font-family="Arial,sans-serif" font-size="18" fill="#18364b">Fuse close to battery+</text><text x="369" y="506" font-family="Arial,sans-serif" font-size="18" fill="#18364b">U7 +Q2/Q3 →10 mΩ→ J2.1</text><rect x="725" y="420" width="300" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="739" y="450" font-family="Arial,sans-serif" font-size="23" fill="#18364b">System positive after R1</text><text x="739" y="480" font-family="Arial,sans-serif" font-size="18" fill="#18364b">J2.1 → charger BAT+</text><text x="739" y="506" font-family="Arial,sans-serif" font-size="18" fill="#18364b">Also →BatteryProtect IN</text><rect x="1090" y="420" width="320" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="1104" y="450" font-family="Arial,sans-serif" font-size="23" fill="#18364b">Smart BatteryProtect</text><text x="1104" y="480" font-family="Arial,sans-serif" font-size="18" fill="#18364b">BPR065022000, load-only</text><text x="1104" y="506" font-family="Arial,sans-serif" font-size="18" fill="#18364b">OUT →2 A fuse→ J3.1</text><polyline points="295,465 355,465" fill="none" stroke="#c03b32" stroke-width="4"/><polyline points="655,465 725,465" fill="none" stroke="#c03b32" stroke-width="4"/><polyline points="1025,465 1090,465" fill="none" stroke="#c03b32" stroke-width="4"/><polyline points="875,420 875,365 965,365 965,295" fill="none" stroke="#c03b32" stroke-width="4"/><text x="978" y="365" font-family="Arial,sans-serif" font-size="17" fill="#18364b">J2 BAT harness</text><rect x="1090" y="610" width="320" height="125" rx="10" fill="#e8f0f5" stroke="#607f92" stroke-width="2"/><text x="1104" y="640" font-family="Arial,sans-serif" font-size="23" fill="#18364b">J3 → buck →3.3 V</text><text x="1104" y="670" font-family="Arial,sans-serif" font-size="18" fill="#18364b">J3.2 = GND</text><text x="1104" y="696" font-family="Arial,sans-serif" font-size="18" fill="#18364b">C6 +3×INA228 +switched boost</text><polyline points="1250,545 1250,610" fill="none" stroke="#c03b32" stroke-width="4"/><polyline points="170,545 170,790 1410,790" fill="none" stroke="#253947" stroke-width="4"/><polyline points="1090,685 1060,685 1060,790" fill="none" stroke="#253947" stroke-width="4"/><polyline points="790,270 710,270 710,790" fill="none" stroke="#253947" stroke-width="4"/><polyline points="1090,520 1045,520 1045,790" fill="none" stroke="#253947" stroke-width="4"/><text x="205" y="778" font-family="Arial,sans-serif" font-size="20" fill="#18364b">GND = battery−, J1.2, J2.2, J3.2 and BatteryProtect GND lead</text><text x="45" y="855" font-family="Arial,sans-serif" font-size="21" fill="#18364b">Battery current sign: positive discharge, negative charging. Controller / raw-presence drain precedes R1.</text><text x="45" y="900" font-family="Arial,sans-serif" font-size="20" fill="#18364b">Normal charger / load current must pass the battery shunt. Do not route charging backward through BatteryProtect.</text><text x="45" y="950" font-family="Arial,sans-serif" font-size="20" fill="#18364b">BMS-off recovery: approved charger at raw battery only after polarity verification; automatic recovery is not provided.</text><text x="45" y="995" font-family="Arial,sans-serif" font-size="18" fill="#18364b">Drawing specifies connections; cable lengths, lugs, fuse breaking capacity and mechanical strain relief require final harness review.</text></svg>